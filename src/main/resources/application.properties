spring.application.name=biblioteca

# Puerto de la app. El 8080 y el 8081 ya estaban ocupados en el PC.
server.port=8082

# Dónde está la base de datos. Dentro de Docker estos valores los pone docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/biblioteca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblioteca}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:biblioteca}

# Crea o actualiza las tablas solo, a partir de las clases del modelo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Carga los datos de ejemplo de data.sql cada vez que arranca, una vez que las tablas ya existen.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Producto 3: cuentas que se crean solas al arrancar (ver config/DatosIniciales.java).
# En Docker se pueden cambiar con las variables APP_ADMIN_EMAIL, APP_ADMIN_PASSWORD y APP_DEMO_PASSWORD.
app.admin.email=${APP_ADMIN_EMAIL:admin@biblioteca.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.demo.password=${APP_DEMO_PASSWORD:usuario123}
