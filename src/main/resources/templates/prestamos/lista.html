<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Préstamos</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!-- Solo administración. Quién se llevó qué, cuándo lo tiene que devolver y botón para registrar la devolución. -->
<nav th:replace="~{fragments/menu :: menu}"></nav>
<main>
  <div th:replace="~{fragments/menu :: avisos}"></div>
  <h1>Préstamos</h1>
  <table>
    <thead><tr><th>Libro</th><th>Usuario</th><th>Préstamo</th><th>Devolución prevista</th><th>Devuelto</th><th></th></tr></thead>
    <tbody>
      <tr th:each="p : ${prestamos}">
        <td th:text="${p.libro.titulo}"></td>
        <td th:text="${p.usuario.nombre}"></td>
        <td th:text="${p.fechaPrestamo}"></td>
        <td th:text="${p.fechaDevolucionPrevista}"></td>
        <td th:text="${p.devuelto} ? 'Sí' : 'No'"></td>
        <td>
          <form th:unless="${p.devuelto}" th:action="@{/admin/prestamos/{id}/devolver(id=${p.id})}" method="post">
            <button class="btn-sec" type="submit">Marcar devuelto</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
