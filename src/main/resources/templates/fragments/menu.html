<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Menú de arriba, igual en todas las pantallas. Lo que se ve depende de quién inició sesión. -->
<nav th:fragment="menu">
  <a th:href="@{/}"><strong>Biblioteca</strong></a>

  <!-- Cualquiera con sesión ve el catálogo. -->
  <a sec:authorize="isAuthenticated()" th:href="@{/libros}">Catálogo</a>

  <!-- Solo el socio. -->
  <a sec:authorize="hasRole('USER')" th:href="@{/user/prestamos}">Mis préstamos</a>
  <a sec:authorize="hasRole('USER')" th:href="@{/user/favoritos}">Favoritos</a>

  <!-- Solo administración. -->
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/libros}">Gestión de libros</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuarios</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/prestamos}">Préstamos</a>

  <span class="espacio"></span>

  <!-- Sin sesión: entrar o registrarse. -->
  <a sec:authorize="isAnonymous()" th:href="@{/login}">Entrar</a>
  <a sec:authorize="isAnonymous()" th:href="@{/registro}">Registrarse</a>

  <!-- Con sesión: quién soy, qué rol tengo y botón para salir. -->
  <span sec:authorize="isAuthenticated()" class="quien">
    <span sec:authentication="name"></span>
    <span sec:authorize="hasRole('ADMIN')" class="rol">ADMIN</span>
    <span sec:authorize="hasRole('USER')" class="rol">USER</span>
  </span>
  <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
    <button type="submit">Salir</button>
  </form>
</nav>

<!-- Mensajes de "todo bien" o de error que llegan después de una acción. -->
<div th:fragment="avisos">
  <div class="aviso ok" th:if="${mensaje}" th:text="${mensaje}"></div>
  <div class="aviso error" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
