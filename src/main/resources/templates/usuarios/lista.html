<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!-- Solo administración. Lista de socios con sus roles. -->
<nav th:replace="~{fragments/menu :: menu}"></nav>
<main>
  <h1>Usuarios</h1>
  <table>
    <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Alta</th><th>Roles</th><th>Activo</th><th>Préstamos</th><th>Favoritos</th></tr></thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.telefono}"></td>
        <td th:text="${u.fechaAlta}"></td>
        <td><span th:each="r, st : ${u.roles}" th:text="${#strings.replace(r.nombre, 'ROLE_', '')} + (${st.last} ? '' : ', ')"></span></td>
        <td th:text="${u.activo} ? 'Sí' : 'No'"></td>
        <td th:text="${u.prestamos.size()}"></td>
        <td th:text="${u.favoritos.size()}"></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
