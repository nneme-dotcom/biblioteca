<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #fff; margin-right: 16px; text-decoration: none; }
    main { padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>
<!-- Lista de socios de la biblioteca. -->
<!-- Menú de arriba, igual en todas las pantallas. -->
<nav>
  <a th:href="@{/libros}">Libros</a>
  <a th:href="@{/usuarios}">Usuarios</a>
  <a th:href="@{/prestamos}">Préstamos</a>
</nav>
<main>
  <h1>Usuarios</h1>
  <table>
    <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Alta</th><th>Préstamos</th></tr></thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.telefono}"></td>
        <td th:text="${u.fechaAlta}"></td>
        <td th:text="${u.prestamos.size()}"></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
