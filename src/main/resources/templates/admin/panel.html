<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca FP065 · Panel de préstamos</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <link rel="stylesheet" th:href="@{/css/estanteria.css}">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<!-- Vista cinematográfica del admin: escritorio 3D con las pilas de libros prestados, sin menú. -->
<body class="pagina3d cine">
<main class="sala3d">
  <div id="escena" class="escena3d" role="img" aria-label="Escritorio 3D con las pilas de libros prestados: vencidos, por vencer y en plazo"></div>

  <div class="kpis-cine">
    <h1>Préstamos activos</h1>
    <div class="fila-kpis">
      <span class="kpi-cine vencido"><b id="k-vencidos">–</b>vencidos</span>
      <span class="kpi-cine pronto"><b id="k-pronto">–</b>vencen en ≤ 3 días</span>
      <span class="kpi-cine ok"><b id="k-ok">–</b>en plazo</span>
      <span class="kpi-cine"><b id="k-estante">–</b>en la estantería</span>
    </div>
  </div>
  <div class="esquina">
    <a class="boton-cine" th:href="@{/vista/tradicional}">Vista tradicional</a>
    <form th:action="@{/logout}" method="post"><button class="boton-cine" type="submit">Salir</button></form>
  </div>
  <p id="ayuda" class="ayuda">Pasá el ratón por un libro para levantarlo · clic para ver quién lo tiene · arrastrá para girar la vista</p>
  <div id="cargando" class="cargando">Cargando el panel…</div>
  <div id="tooltip" class="tip" hidden></div>
</main>
<script type="module" th:src="@{/js/panel.js}"></script>
</body>
</html>
