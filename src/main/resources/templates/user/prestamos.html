<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis préstamos</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!-- Zona del socio: solo sus propios préstamos. -->
<nav th:replace="~{fragments/menu :: menu}"></nav>
<main>
  <div th:replace="~{fragments/menu :: avisos}"></div>
  <h1>Mis préstamos</h1>
  <p th:if="${prestamos.isEmpty()}">Todavía no pediste ningún libro. <a th:href="@{/libros}">Ir al catálogo</a></p>
  <table th:unless="${prestamos.isEmpty()}">
    <thead><tr><th>Libro</th><th>Préstamo</th><th>Devolución prevista</th><th>Estado</th></tr></thead>
    <tbody>
      <tr th:each="p : ${prestamos}">
        <td th:text="${p.libro.titulo}"></td>
        <td th:text="${p.fechaPrestamo}"></td>
        <td th:text="${p.fechaDevolucionPrevista}"></td>
        <td th:text="${p.devuelto} ? 'Devuelto' : 'En casa'"></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
