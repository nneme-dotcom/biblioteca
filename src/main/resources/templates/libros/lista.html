<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Libros</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!-- Lista de libros. La misma vista sirve al socio (catálogo) y a administración (gestión):
     los botones que aparecen dependen del rol. -->
<nav th:replace="~{fragments/menu :: menu}"></nav>
<main>
  <div th:replace="~{fragments/menu :: avisos}"></div>
  <h1 sec:authorize="hasRole('ADMIN')">Gestión de libros</h1>
  <h1 sec:authorize="!hasRole('ADMIN')">Catálogo</h1>

  <p sec:authorize="hasRole('USER')"><a th:href="@{/libros}">Ver el catálogo como estantería 3D</a></p>
  <p sec:authorize="hasRole('ADMIN')"><a class="btn" th:href="@{/admin/libros/nuevo}">+ Nuevo libro</a></p>

  <table>
    <thead>
      <tr><th>Título</th><th>ISBN</th><th>Año</th><th>Disponible</th><th>Autores</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="libro : ${libros}">
        <td th:text="${libro.titulo}"></td>
        <td th:text="${libro.isbn}"></td>
        <td th:text="${libro.anio}"></td>
        <td th:text="${libro.disponible} ? 'Sí' : 'No'"></td>
        <td>
          <span th:each="autor, st : ${libro.autores}" th:text="${autor.nombre} + (${st.last} ? '' : ', ')"></span>
        </td>
        <td>
          <!-- Administración: editar y borrar. -->
          <th:block sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/libros/{id}/editar(id=${libro.id})}">Editar</a>
            <form th:action="@{/admin/libros/{id}/eliminar(id=${libro.id})}" method="post" style="display:inline">
              <button class="btn-sec" type="submit">Eliminar</button>
            </form>
          </th:block>
          <!-- Socio: pedirlo prestado (si está libre) y marcarlo como favorito. -->
          <th:block sec:authorize="hasRole('USER')">
            <form th:if="${libro.disponible}" th:action="@{/user/prestamos/solicitar/{id}(id=${libro.id})}"
                  method="post" style="display:inline">
              <button class="btn" type="submit">Pedir prestado</button>
            </form>
            <form th:action="@{/user/favoritos/{id}(id=${libro.id})}" method="post" style="display:inline">
              <button class="estrella" type="submit"
                      th:title="${favoritosIds.contains(libro.id)} ? 'Quitar de favoritos' : 'Añadir a favoritos'"
                      th:text="${favoritosIds.contains(libro.id)} ? '★' : '☆'"></button>
            </form>
          </th:block>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
