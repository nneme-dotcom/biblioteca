<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca FP065 · Estantería</title>
  <!-- Token CSRF para las acciones que se hacen sin recargar (préstamo y favoritos). -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <link rel="stylesheet" th:href="@{/css/estanteria.css}">
  <!-- three.js desde su CDN oficial (versión fija). -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<!-- Vista cinematográfica del socio: solo la estantería, sin menú. Todo se hace desde los libros. -->
<body class="pagina3d cine" th:attr="data-socio=${#authentication.name}">
<main class="sala3d">
  <div id="escena" class="escena3d" role="img" aria-label="Estantería 3D con los libros de la biblioteca ordenados por género"></div>

  <!-- Lo único fijo en pantalla: ir a la vista tradicional y salir. -->
  <div class="esquina">
    <a class="boton-cine" th:href="@{/vista/tradicional}">Vista tradicional</a>
    <form th:action="@{/logout}" method="post"><button class="boton-cine" type="submit">Salir</button></form>
  </div>

  <p id="ayuda" class="ayuda" aria-live="polite"></p>
  <p id="aviso" class="aviso-cine" role="status" hidden></p>
  <div id="cargando" class="cargando">Montando la estantería…</div>
  <div id="tooltip" class="tip" hidden></div>
  <noscript><div class="cargando">La vista cinematográfica necesita JavaScript. <a href="/vista/tradicional">Ir a la vista tradicional</a></div></noscript>
</main>
<script type="module" th:src="@{/js/estanteria.js}"></script>
</body>
</html>
